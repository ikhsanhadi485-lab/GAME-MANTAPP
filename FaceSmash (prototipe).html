<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171238"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>FaceSmash</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe9ff;--fg:#241b4a;--panel:#ffffff;--line:#cfc4f3;--hot:#ff4f81;--sun:#ffb800;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171238;--fg:#f3efff;--panel:#241d52;--line:#3b3180;--hot:#ff5c8a;--sun:#ffc933;--on:#171238}}
:root[data-theme="dark"]{--bg:#171238;--fg:#f3efff;--panel:#241d52;--line:#3b3180;--hot:#ff5c8a;--sun:#ffc933;--on:#171238}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Nunito,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
h1{font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:.06em;font-size:2rem;margin:0;color:var(--hot);line-height:1}
.top{display:flex;justify-content:space-between;align-items:baseline;width:100%;max-width:440px}
#cnt{font-weight:800}
#wrap{position:relative;width:100%;max-width:440px;aspect-ratio:715/572;border-radius:18px;overflow:hidden;border:3px solid var(--line);background:var(--panel);touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
#fx{pointer-events:none}
#c{cursor:crosshair}
.bar{display:flex;gap:8px;width:100%;max-width:440px}
.bar button,.bar label{flex:1;font:inherit;font-weight:800;background:var(--panel);color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:8px 2px;text-align:center;cursor:pointer;font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.bar span{font-size:1.6rem;line-height:1}
.bar button.on{background:var(--sun);color:var(--on);border-color:var(--sun)}
.bar button:focus-visible,.bar label:focus-within{outline:3px solid var(--hot);outline-offset:2px}
.sec button{background:var(--hot);color:#fff;border-color:var(--hot)}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
small{opacity:.75;text-align:center;max-width:440px}
</style>
</head>
<body>
<div class="top"><h1>FaceSmash</h1><div id="cnt">Pukulan: 0</div></div>
<div id="wrap"><canvas id="c" width="715" height="572" aria-label="Area foto"></canvas><canvas id="fx" width="715" height="572"></canvas></div>
<div class="bar" id="weap">
<button data-w="hammer" class="on"><span>🔨</span>Palu</button>
<button data-w="pistol"><span>🔫</span>Pistol</button>
<button data-w="tomato"><span>🍅</span>Tomat</button>
</div>
<div class="bar sec">
<button id="reset"><span>↺</span>Reset foto</button>
<label><span>📷</span>Ganti foto<input type="file" id="file" accept="image/*"></label>
</div>
<small>Foto hanya diproses di perangkatmu dan tidak diunggah ke mana pun. Foto awal bisa diganti dengan foto dari galeri atau kamera.</small>
<script>
let W=715,H=572;const $=s=>document.querySelector(s);
const c=$('#c'),ctx=c.getContext('2d'),fx=$('#fx'),fctx=fx.getContext('2d'),wrap=$('#wrap');
const mk=()=>{const k=document.createElement('canvas');k.width=W;k.height=H;return k};
const base=mk(),bctx=base.getContext('2d'),dmg=mk(),dctx=dmg.getContext('2d');
let weapon='hammer',hits=0,parts=[],running=false,ac=null;
const R=(a,b)=>a+Math.random()*(b-a);

function render(){ctx.clearRect(0,0,W,H);ctx.drawImage(base,0,0);ctx.drawImage(dmg,0,0)}

function drawDummy(){
  const g=bctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7fd3ff');g.addColorStop(1,'#d6f2ff');
  bctx.fillStyle=g;bctx.fillRect(0,0,W,H);
  bctx.fillStyle='#3a2a1e';bctx.beginPath();bctx.ellipse(360,380,230,250,0,0,7);bctx.fill();
  bctx.fillStyle='#ffd7a8';bctx.beginPath();bctx.ellipse(360,470,200,250,0,0,7);bctx.fill();
  bctx.fillStyle='#fff';[[285,430],[435,430]].forEach(([x,y])=>{bctx.beginPath();bctx.ellipse(x,y,42,32,0,0,7);bctx.fill()});
  bctx.fillStyle='#222';[[290,432],[440,432]].forEach(([x,y])=>{bctx.beginPath();bctx.arc(x,y,17,0,7);bctx.fill()});
  bctx.strokeStyle='#3a2a1e';bctx.lineWidth=12;bctx.lineCap='round';
  bctx.beginPath();bctx.moveTo(240,370);bctx.lineTo(330,355);bctx.moveTo(390,355);bctx.lineTo(480,370);bctx.stroke();
  bctx.strokeStyle='#b5453a';bctx.lineWidth=14;bctx.beginPath();bctx.arc(360,540,80,.2,Math.PI-.2);bctx.stroke();
  bctx.fillStyle='#ff9d8a';bctx.beginPath();bctx.arc(230,510,28,0,7);bctx.arc(490,510,28,0,7);bctx.fill();
  bctx.fillStyle='#ffd7a8';bctx.beginPath();bctx.ellipse(360,470,18,26,0,0,7);bctx.fill();
}
function fit(){wrap.style.width='min(100%,'+Math.max(220,Math.round((innerHeight-215)*W/H))+'px)'}
function setPhoto(img){
  const k=Math.min(1,960/Math.max(img.width,img.height));
  W=Math.round(img.width*k);H=Math.round(img.height*k);
  [c,fx,base,dmg].forEach(v=>{v.width=W;v.height=H});
  wrap.style.aspectRatio=W+'/'+H;
  bctx.drawImage(img,0,0,W,H);
  fit();resetDmg();
}
function resetDmg(){dctx.clearRect(0,0,W,H);hits=0;$('#cnt').textContent='Pukulan: 0';render()}

/* ---- suara ---- */
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return ac}
function tone(f0,f1,d,v){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(f0,a.currentTime);o.frequency.exponentialRampToValueAtTime(f1,a.currentTime+d);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}
function noise(d,type,f,v){const a=audio();if(!a)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type=type;fl.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);s.connect(fl).connect(g).connect(a.destination);s.start()}
const SND={hammer:()=>{tone(160,40,.25,.9);noise(.12,'lowpass',900,.6)},pistol:()=>{noise(.18,'highpass',1200,.8);tone(500,80,.12,.4)},tomato:()=>{noise(.3,'lowpass',500,.9);tone(220,60,.2,.3)}};
const VIB={hammer:60,pistol:30,tomato:[20,30,20]},SHAKE={hammer:16,pistol:7,tomato:5};

/* ---- efek kerusakan ---- */
function crack(x,y){
  const g=dctx.createRadialGradient(x,y,0,x,y,80);g.addColorStop(0,'rgba(0,0,0,.35)');g.addColorStop(1,'rgba(0,0,0,0)');
  dctx.fillStyle=g;dctx.beginPath();dctx.arc(x,y,80,0,7);dctx.fill();
  dctx.lineCap='round';dctx.lineJoin='round';
  for(let i=0;i<10;i++){
    let a=R(0,6.28),px=x,py=y,pts=[[x,y]];
    for(let j=0;j<5;j++){a+=R(-.5,.5);const l=R(25,60);px+=Math.cos(a)*l;py+=Math.sin(a)*l;pts.push([px,py])}
    [['rgba(0,0,0,.55)',5],['rgba(255,255,255,.9)',2]].forEach(([col,lw])=>{dctx.strokeStyle=col;dctx.lineWidth=lw;dctx.beginPath();pts.forEach((p,k)=>k?dctx.lineTo(p[0],p[1]):dctx.moveTo(p[0],p[1]));dctx.stroke()});
  }
}
function hole(x,y){
  dctx.fillStyle='rgba(0,0,0,.25)';dctx.beginPath();dctx.arc(x,y,24,0,7);dctx.fill();
  dctx.fillStyle='#0a0a0a';dctx.beginPath();dctx.arc(x,y,12,0,7);dctx.fill();
  dctx.strokeStyle='rgba(255,255,255,.8)';dctx.lineWidth=2;dctx.lineCap='round';
  for(let i=0;i<5;i++){const a=R(0,6.28),l=R(20,45);dctx.beginPath();dctx.moveTo(x+Math.cos(a)*14,y+Math.sin(a)*14);dctx.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);dctx.stroke()}
}
function splat(x,y){
  dctx.fillStyle='rgba(200,35,25,.85)';
  dctx.beginPath();dctx.arc(x,y,R(40,58),0,7);dctx.fill();
  for(let i=0;i<14;i++){const a=R(0,6.28),d=R(35,115);dctx.beginPath();dctx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,R(6,22),0,7);dctx.fill()}
  dctx.strokeStyle='rgba(200,35,25,.8)';dctx.lineCap='round';
  for(let i=0;i<3;i++){dctx.lineWidth=R(6,11);const dx=x+R(-40,40);dctx.beginPath();dctx.moveTo(dx,y);dctx.lineTo(dx,y+R(50,140));dctx.stroke()}
  dctx.fillStyle='rgba(255,170,150,.55)';dctx.beginPath();dctx.arc(x-12,y-14,10,0,7);dctx.fill();
}
const DO={hammer:crack,pistol:hole,tomato:splat};
const COL={hammer:['#fff','#ddd','#999'],pistol:['#ffe27a','#ff9d3b','#555'],tomato:['#c82319','#ff6a52','#7a0f0a']};

/* ---- partikel ---- */
function burst(x,y){
  for(let i=0;i<22;i++){const a=R(0,6.28),s=R(3,11);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,r:R(3,8),l:1,c:COL[weapon][i%3]})}
  if(!running){running=true;requestAnimationFrame(step)}
}
function step(){
  fctx.clearRect(0,0,W,H);
  parts=parts.filter(p=>p.l>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.5;p.l-=.035;fctx.globalAlpha=Math.max(p.l,0);fctx.fillStyle=p.c;fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,7);fctx.fill()});
  fctx.globalAlpha=1;
  if(parts.length)requestAnimationFrame(step);else{running=false;fctx.clearRect(0,0,W,H)}
}

/* ---- interaksi ---- */
c.addEventListener('pointerdown',e=>{
  e.preventDefault();audio();
  const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  DO[weapon](x,y);render();burst(x,y);SND[weapon]();
  try{navigator.vibrate&&navigator.vibrate(VIB[weapon])}catch(_){}
  const s=SHAKE[weapon];
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)wrap.animate([{transform:'translate(0,0)'},{transform:`translate(${s}px,${-s}px)`},{transform:`translate(${-s}px,${s/2}px)`},{transform:'translate(0,0)'}],{duration:160});
  $('#cnt').textContent='Pukulan: '+(++hits);
});
$('#weap').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  weapon=b.dataset.w;document.querySelectorAll('#weap button').forEach(x=>x.classList.toggle('on',x===b));
});
$('#reset').onclick=resetDmg;
$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const u=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{setPhoto(img);URL.revokeObjectURL(u)};
  img.onerror=()=>{alert('Foto tidak bisa dibuka. Coba file JPG atau PNG.');URL.revokeObjectURL(u)};
  img.src=u;e.target.value='';
};
addEventListener("resize",fit);
